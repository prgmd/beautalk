# Beautalk nginx — Vue 정적 서빙 + /api → backend(gunicorn) 프록시.
# Phase 1: HTTP(80)만. Phase 2에서 certbot으로 443 server 블록 + HTTP→HTTPS 리다이렉트 추가.
server {
    listen 80;
    server_name beautalk.site www.beautalk.site;
    client_max_body_size 10M;

    # certbot ACME 챌린지 (Phase 2 HTTPS 발급용 webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API → Django(gunicorn). X-Forwarded-Proto로 Django가 원요청 스킴을 인식(secure 쿠키).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin·정적 (whitenoise가 gunicorn에서 서빙)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA — 빌드 산출물(dist) 서빙, 없는 경로는 index.html로(클라이언트 라우팅)
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
