# Beautalk nginx — Vue 정적 서빙 + /api → backend(gunicorn) 프록시.
# Phase 2: certbot 발급 완료 → 80은 ACME 챌린지 + HTTPS 리다이렉트만, 443이 실제 서빙.

# HTTP(80) — certbot 갱신용 webroot 챌린지만 통과시키고 나머진 HTTPS로 리다이렉트.
server {
    listen 80;
    server_name beautalk.site www.beautalk.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name beautalk.site www.beautalk.site;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/beautalk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beautalk.site/privkey.pem;

    # API → Django(gunicorn). X-Forwarded-Proto로 Django가 원요청 스킴을 인식(secure 쿠키).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin·정적 (whitenoise가 gunicorn에서 서빙)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA — 빌드 산출물(dist) 서빙, 없는 경로는 index.html로(클라이언트 라우팅)
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
