<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Serif+KR:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.left { position:absolute; left:110px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
.brand { display:flex; align-items:center; gap:22px; }
.brand img { width:110px; height:110px; }
.name { font-family:'Fraunces', serif; font-size:112px; font-weight:600; letter-spacing:-2px; line-height:1; }
.tagline { font-family:'Noto Serif KR', serif; font-size:30px; color:var(--sage-ink); margin-top:26px; }
.sub { font-size:20px; color:var(--ink-soft); margin-top:14px; }
.chat { position:absolute; right:110px; top:150px; width:600px; display:flex; flex-direction:column; gap:18px; }
.bubble { padding:20px 24px; border-radius:24px; font-size:19px; line-height:1.5; box-shadow:0 12px 30px rgba(80,70,50,0.10); }
.me { align-self:flex-end; background:var(--sage); color:#fff; border-bottom-right-radius:8px; max-width:440px; }
.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:8px; width:100%; }
.bot .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.ok { padding:5px 12px; border-radius:999px; background:var(--sage-soft); color:var(--sage-ink); font-size:15px; font-weight:700; }
</style>
</head>
<body style="width:1680px;height:520px">
<div class="left">
  <div class="brand"><img src="../../frontend/public/logo.png"><div class="name">beautalk</div></div>
  <div class="tagline">당신의 뷰티 상담사, 뷰토크</div>
  <div class="sub">대화로 조건을 모으고, 조건을 지키는 제품만 추천합니다</div>
</div>
<div class="chat">
  <div class="bubble me">지성인데 3만원 밑으로 산뜻한 로션 있을까요?</div>
  <div class="bubble bot">조건에 맞는 제품 세 개를 골랐어요. 각각 왜 맞는지 함께 적어 둘게요.
    <div class="row"><span class="ok">✓ 가격</span><span class="ok">✓ 제형</span><span class="ok">✓ 카테고리</span></div>
  </div>
</div>
</body>
</html>
