# Beautalk 로컬 개발용 인프라
# 현재: PostgreSQL만 컨테이너로 구동 (Django는 호스트에서 runserver)
# 향후: backend 서비스를 추가해 전체 컨테이너화 (배포 단계)
#
# 사용법:
#   docker compose up -d        # PostgreSQL 기동
#   docker compose ps           # 상태 확인
#   docker compose down         # 중지 (데이터는 볼륨에 보존)
#   docker compose down -v      # 중지 + 데이터 삭제
#
# 접속 정보는 backend/.env 의 DB_* 값과 일치해야 한다.
# 아래 ${VAR:-default} 는 root .env 가 없으면 default 를 사용한다.

services:
  db:
    # pgvector 확장이 포함된 PostgreSQL 16 이미지 (RAG 벡터 검색용).
    # postgres:16과 데이터 파일 호환 → 기존 postgres_data 볼륨 그대로 사용.
    image: pgvector/pgvector:pg16
    container_name: beautalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-beautalk}
      POSTGRES_USER: ${DB_USER:-beautalk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beautalk}
      # 컨테이너 내부 인코딩 고정 (한글 데이터 안전)
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beautalk} -d ${DB_NAME:-beautalk}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
